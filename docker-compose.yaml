version: "3.9"

services:
  fuseki:
    image: stain/jena-fuseki
    environment:
      ADMIN_PASSWORD: admin123
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki-data:/fuseki
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3030/$$/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rag_server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - app-network

  kg_server:
    build:
      context: .
      dockerfile: Dockerfile.kg
    env_file:
      - .env
    environment:
      FUSEKI_URL: http://fuseki:3030/imt
    depends_on:
      fuseki:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - app-network

  api_server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      RAG_SERVER_URL: http://rag_server:3000/mcp
      KG_SERVER_URL: http://kg_server:3001/mcp
    depends_on:
      - rag_server
      - kg_server
    ports:
      - "5000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
